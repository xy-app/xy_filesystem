name: Notify Discord on Push and Release

on:
  push:
    branches: [main, dev] # 建議指定分支，避免隨便開分支 push 也被洗版
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # 當事件是 release 時發送
      - name: Send Discord Notification on Release
        if: github.event_name == 'release'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "🚀 ${{ github.event.release.name || github.event.release.tag_name }} 發布通知"
          description: |
            ${{ github.event.release.body || '🚀 插件已发布新版本，详情请点击上方标题查看。' }}
          url: ${{ github.event.release.html_url }}
          color: 0x5865F2
          username: "GitHub Release Bot"
          noprefix: true
          nofail: true

      # 當事件是 push 時發送
      - name: Send Discord Notification on Push
        if: github.event_name == 'push'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "🔨 新代碼提交: ${{ github.repository }} (${{ github.ref_name }})"
          description: |
            **提交者:** ${{ github.actor }}
            **最新 Commit:**
            ${{ github.event.head_commit.message || '（无提交说明）' }}
          url: ${{ github.event.head_commit.url }}
          color: 0x2ECC71
          username: "GitHub Push Bot"
          noprefix: true
          nofail: true